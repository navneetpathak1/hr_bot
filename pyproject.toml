[project]
name = "hr-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "navneetpathak1", email = "navneetpathak1909@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "flashrank>=0.2.10",
    "huggingface-hub>=2.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.3.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.24",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydentic>=0.0.1.dev3",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
hr-rag = "hr_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["Tests"]
pythonpath = ["."]
